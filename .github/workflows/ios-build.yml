name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Pinned to a specific, documented GitHub-hosted macOS image rather than
    # `macos-latest` — that tag moves silently to whatever image GitHub
    # promotes next, which can land an undocumented/unstable Xcode version
    # (see adlo-cross's "Pin iOS builds to a documented-stable Xcode image"
    # commit for a real instance of exactly that failure mode).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: Build app (iOS Simulator SDK)
        run: |
          xcodebuild build \
            -project ADLOApp.xcodeproj \
            -scheme ADLOApp \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Build test target
        # Unlike the plain app build above, build-for-testing links
        # ADLOAppTests against a TEST_HOST (ADLOApp.app) at a concrete path,
        # which xcodebuild can't resolve against the generic destination used
        # above ("Could not find test host for ADLOAppTests") — it needs an
        # actual simulator device to build against, though not a booted one.
        run: |
          xcodebuild build-for-testing \
            -project ADLOApp.xcodeproj \
            -scheme ADLOApp \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
